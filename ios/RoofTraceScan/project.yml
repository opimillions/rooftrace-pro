# XcodeGen spec — run `xcodegen` in this folder to create RoofTraceScan.xcodeproj
name: RoofTraceScan
options:
  bundleIdPrefix: com.thepublicadjustertx
  deploymentTarget:
    iOS: "17.0"
targets:
  RoofTraceScan:
    type: application
    platform: iOS
    sources: [RoofTraceScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepublicadjustertx.rooftracescan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RoofTrace Scan
        INFOPLIST_KEY_NSCameraUsageDescription: RoofTrace Scan uses the camera and LiDAR scanner to measure rooms.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: RoofTraceScan/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.thepublicadjustertx.rooftracescan
            CFBundleURLSchemes: [rooftracescan]
