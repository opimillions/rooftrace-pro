<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Background (transparent) -->
  
  <!-- Roof icon -->
  <g transform="translate(8, 8)">
    <!-- House/roof shape -->
    <polygon points="32,4 60,24 56,24 56,56 8,56 8,24 4,24" 
             fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Ridge line -->
    <line x1="32" y1="4" x2="32" y2="56" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- Hip lines -->
    <line x1="32" y1="4" x2="8" y2="24" stroke="#ea580c" stroke-width="2.5"/>
    <line x1="32" y1="4" x2="56" y2="24" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Left slope facet fill -->
    <polygon points="32,4 8,24 8,56 32,56" fill="#3b82f6" fill-opacity="0.25"/>
    <!-- Right slope facet fill -->
    <polygon points="32,4 56,24 56,56 32,56" fill="#3b82f6" fill-opacity="0.18"/>
    <!-- Valley line -->
    <line x1="32" y1="36" x2="20" y2="56" stroke="#16a34a" stroke-width="2"/>
    <!-- Measurement dots -->
    <circle cx="32" cy="4" r="3" fill="#f59e0b"/>
    <circle cx="8" cy="24" r="2.5" fill="#ea580c"/>
    <circle cx="56" cy="24" r="2.5" fill="#ea580c"/>
  </g>

  <!-- Brand text -->
  <text x="82" y="34" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="white" letter-spacing="-0.5">Roof</text>
  <text x="138" y="34" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#f59e0b" letter-spacing="-0.5">Trace</text>
  <text x="216" y="34" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="white" letter-spacing="-0.5"> Pro</text>
  
  <!-- Tagline -->
  <text x="82" y="54" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">AERIAL ROOF MEASUREMENT</text>
</svg>
