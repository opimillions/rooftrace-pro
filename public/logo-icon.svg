<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background pill -->
  <rect width="64" height="64" rx="14" fill="#172235"/>
  
  <!-- Roof shape -->
  <polygon points="32,8 56,26 52,26 52,54 12,54 12,26 8,26" 
           fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Ridge -->
  <line x1="32" y1="8" x2="32" y2="54" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
  
  <!-- Hip lines -->
  <line x1="32" y1="8" x2="12" y2="26" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="32" y1="8" x2="52" y2="26" stroke="#ea580c" stroke-width="2.5"/>
  
  <!-- Facet fills -->
  <polygon points="32,8 12,26 12,54 32,54" fill="#3b82f6" fill-opacity="0.3"/>
  <polygon points="32,8 52,26 52,54 32,54" fill="#3b82f6" fill-opacity="0.2"/>
  
  <!-- Valley -->
  <line x1="32" y1="38" x2="20" y2="54" stroke="#16a34a" stroke-width="2"/>
  
  <!-- Key points -->
  <circle cx="32" cy="8" r="3" fill="#f59e0b"/>
  <circle cx="12" cy="26" r="2.5" fill="#ea580c"/>
  <circle cx="52" cy="26" r="2.5" fill="#ea580c"/>
</svg>
