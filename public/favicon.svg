<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Satellite/aerial view house outline -->
  <rect x="6" y="8" width="20" height="16" rx="1" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Ridge line (red) -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Hip lines (orange) -->
  <line x1="6" y1="8" x2="16" y2="14" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="26" y1="8" x2="16" y2="14" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="6" y1="24" x2="16" y2="18" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="26" y1="24" x2="16" y2="18" stroke="#ea580c" stroke-width="1.5"/>
  <!-- Crosshair/measurement dot at center -->
  <circle cx="16" cy="16" r="2" fill="#f59e0b"/>
  <!-- Small measurement lines -->
  <line x1="14" y1="16" x2="12" y2="16" stroke="#f59e0b" stroke-width="1"/>
  <line x1="18" y1="16" x2="20" y2="16" stroke="#f59e0b" stroke-width="1"/>
</svg>
