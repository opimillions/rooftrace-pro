<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Blue background -->
  <rect width="32" height="32" rx="6" fill="#1565C0"/>
  <!-- Gold house/roof shape -->
  <polygon points="16,4 28,14 24,14 24,28 8,28 8,14 4,14" 
           fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gold roof peak filled -->
  <polygon points="16,4 28,14 4,14" fill="#f59e0b" opacity="0.3"/>
  <!-- White measurement line (ridge) -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="white" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
</svg>
